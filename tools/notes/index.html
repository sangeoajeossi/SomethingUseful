<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>메모 · Something Useful</title>
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header class="top">
  <a class="back" href="../../">← 홈</a>
  <h1>메모</h1>
</header>
<main>
  <label class="label" for="memo">내용 <span class="hint" id="count">0자</span></label>
  <textarea id="memo" class="textarea" rows="12" placeholder="여기에 적으면 이 기기에 자동 저장돼요" spellcheck="false"></textarea>
  <div class="row">
    <button id="copy" class="btn btn-primary" type="button">복사</button>
    <button id="clear" class="btn btn-danger" type="button">모두 지우기</button>
  </div>
  <p class="status" id="msg" aria-live="polite"></p>
</main>
<script src="../../assets/app.js"></script>
<script>
  const KEY = "su:notes";
  const ta = document.getElementById("memo");
  const count = document.getElementById("count");
  const msg = document.getElementById("msg");

  ta.value = localStorage.getItem(KEY) || "";
  const updateCount = () => { count.textContent = ta.value.length.toLocaleString("ko-KR") + "자"; };
  updateCount();

  let saveTimer;
  ta.addEventListener("input", () => {
    updateCount();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { localStorage.setItem(KEY, ta.value); say("저장됨"); }, 300);
  });

  document.getElementById("copy").addEventListener("click", async () => {
    if (!ta.value) { say("복사할 내용이 없어요"); return; }
    try { await navigator.clipboard.writeText(ta.value); }
    catch { ta.select(); document.execCommand("copy"); }
    say("복사했어요");
  });

  document.getElementById("clear").addEventListener("click", () => {
    if (!ta.value) return;
    if (!confirm("메모를 모두 지울까요? 되돌릴 수 없어요.")) return;
    ta.value = "";
    localStorage.removeItem(KEY);
    updateCount();
    say("지웠어요");
    ta.focus();
  });

  function say(text) {
    msg.textContent = text;
    clearTimeout(say.timer);
    say.timer = setTimeout(() => { msg.textContent = ""; }, 1500);
  }
</script>
</body>
</html>
